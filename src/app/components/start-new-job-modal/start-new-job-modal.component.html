<div mat-dialog-title>Start New Job</div>
<mat-dialog-content>
  <app-error-message
    [error]="httpErrorService.modalErrorMessage()"
    [dismissible]="true"
    (dismissed)="clearError()"
  />
  <mat-form-field appearance="outline" class="form-selector">
    <mat-label>Select Form</mat-label>
    <input
      matInput
      [value]="selectedForm()?.title ?? formSearch()"
      [matAutocomplete]="formAutocomplete"
      (input)="onFormInput($event)"
      autocomplete="off"
      aria-label="Select Form"
    />
    <mat-autocomplete
      #formAutocomplete="matAutocomplete"
      [displayWith]="displayFormName"
      (optionSelected)="onFormSelected($event.option.value)"
    >
      @for (form of filteredFormNames(); track form.name) {
         <mat-option [value]="form.name">{{ form.title }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
  <mat-tab-group color="primary" mat-stretch-tabs="false">
    <mat-tab label="Search For Patient">
      <app-patient-search/>
    </mat-tab>
    <mat-tab label="Select Patient by Group">
      <app-patient-groups/>
    </mat-tab>
  </mat-tab-group>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="outlined" color="primary" mat-dialog-close type="button" (click)="onClose()">Cancel</button>
  <div class=margin-left-sm [matTooltip]="!(selectedPatient() && selectedForm()) ? 'Please select both a patient and a form to start the job' : ''"
       matTooltipPosition="above">
    <button matButton="filled" color="primary" cdkFocusInitial type="submit"
            [disabled]="!(selectedPatient() && selectedForm()) || isStarting()"
            [attr.aria-busy]="isStarting()"
            (click)="onStart()">Start Job</button>
  </div>
</mat-dialog-actions>
