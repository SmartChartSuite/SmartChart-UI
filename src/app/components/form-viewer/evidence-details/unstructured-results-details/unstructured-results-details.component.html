<mat-card>
  <mat-card-content>
    <div class="flex-row">
      <span class="row-label">Date (Age At):</span> {{ nlpAnswerDTO?.dateAgeAt }}
    </div>
    @for (answerComponent of nlpAnswer?.componentAnswerList | slice:1; track answerComponent; let i = $index) {
      <div class="flex-row margin-top-sm">
        <span class="row-label">{{ answerComponent.label }}</span> : {{ answerComponent.value }}
      </div>
    }

    <div class="flex">

      <div class="actions-col">
        @if (fullTextVisible) {
          <button mat-icon-button (click)="fullTextVisible=false" matTooltip="Collapse Content">
            <mat-icon>unfold_less</mat-icon>
          </button>
        } @else {
          <button mat-icon-button (click)="fullTextVisible=true" matTooltip="Expand Content">
            <mat-icon>unfold_more</mat-icon>
          </button>
        }
        <button mat-icon-button (click)="onOpenInModal()" matTooltip="View Full Document">
          <mat-icon>open_in_full</mat-icon>
        </button>
      </div>
    </div>

  </mat-card-content>

  @if (fullTextVisible) {
    <mat-card-content>
      <pre class="full-text-content" [innerHTML]="safeHtmlFullText"></pre>
    </mat-card-content>
  }
</mat-card>
