<form [formGroup]="form" class="date-time-inputs">
  @if (questionType == QuestionnaireItemType.dateTime || questionType == QuestionnaireItemType.date) {
    Found date
    <mat-form-field
      appearance="outline"
      class="margin-right-lg">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName='date'>
      <mat-hint>Date Format: YYYY-MM-DD</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
    </mat-form-field>
  }
  @if (questionType == QuestionnaireItemType.dateTime || questionType == QuestionnaireItemType.time) {
    <mat-form-field appearance="outline" class="margin-right-lg">
      <mat-label>Time</mat-label>
      <input matInput [matTimepicker]="timePicker"  formControlName='time'>
      <mat-timepicker-toggle matIconSuffix [for]="timePicker"/>
      <mat-timepicker #timePicker/>
      <mat-hint>Time Format: HH-MM</mat-hint>
    </mat-form-field>
  }
</form>
