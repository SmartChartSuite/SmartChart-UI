  <div class="patient-details-container">
    <div class="patient-details">
      <div class="patient-details-label">
        Name
      </div>
      <div class="patient-details-value">
        {{ patientSummary.name.given }}&nbsp;{{ patientSummary.name.family }}
      </div>
    </div>
    <div class="patient-details">
      <div class="patient-details-label">
        Gender
      </div>
      <div class="patient-details-value">
        {{ patientSummary.gender | titlecase }}
      </div>
    </div>
    <div class="patient-details">
      <div class="patient-details-label">
        Date of Birth
      </div>
      <div class="patient-details-value">
        {{ patientSummary.birthDate | date : 'MM/dd/yyyy' }}
      </div>
    </div>
  </div>  
  @if (identifierSystem) {
    <div class="patient-details-container identifier">
      <div class="patient-details">
        <div class="patient-details-label">
          {{ identifierLabel }}
        </div>
        <div class="patient-details-value">
          {{ identifierValue }}
        </div>
      </div>
    </div>
  }
