@if (isLocatedInMainMenu) {
  <div class="user-profile-header">
    @if (oauthService.hasValidAccessToken()) {
      <ng-container class="profile-wrapper"></ng-container>
    }
    @if (oauthService.getIdentityClaims(); as user) {
      <div>
        <img
          [src]="user?.['picture'] ? user?.['picture'] : '/assets/portrait_placeholder.png'"
          referrerpolicy="no-referrer"
          class="profile-image">
      </div>
    }
  </div>
}
@else {
  <div class="login-container">
    <div class="login-card-wrapper">
      <p-card>
        <ng-template #title>Sign In</ng-template>
        <p>
          Sign In With Auth0
        </p>
        <ng-template #footer>
          <div class="flex gap-4 mt-1">
            <p-button
              label="Sign In"
              icon="pi pi-sign-in" iconPos="left" styleClass="w-full"
              (click)="oauthService.initImplicitFlow()"/>
          </div>
        </ng-template>
      </p-card>
    </div>
  </div>
