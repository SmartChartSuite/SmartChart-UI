<mat-tab-group
  color="primary"
  mat-stretch-tabs="false"
  [(selectedIndex)]="selectedTabIndex">
  <mat-tab [label]="'Structured (' + (evidence.structured?.length ?? 0) + ')'">
    <div class="margin-md">
      @if (evidence.structured?.length) {
        <mat-accordion multi>
          @for (structured of evidence.structured; let i = $index; track i) {
            <app-structured-evidence [evidence]="structured"></app-structured-evidence>
          }
        </mat-accordion>
      } @else {
        No Structured Evidence Found
      }
    </div>
  </mat-tab>
  <mat-tab [label]="'Unstructured (' + (evidence.unstructured?.supportingEvidence?.length ?? 0) + ')'">
    <div class="margin-md">
      @if (evidence.unstructured?.supportingEvidence?.length) {
        <app-unstructured-evidence
          [evidence]="evidence.unstructured"
          [patientSummary]="activeFormSummary.patientSummary">
        </app-unstructured-evidence>
      } @else {
        No Unstructured Evidence Found
      }
    </div>
  </mat-tab>
</mat-tab-group>
