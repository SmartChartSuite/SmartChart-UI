@if (isLocatedInMainMenu()) {
  <div class="user-profile-header">
    @if (oauthService.hasValidAccessToken()) {
      <ng-container class="profile-wrapper"></ng-container>
    }

    @if (oauthService.getIdentityClaims()) {
      <div>
        <img
          [src]="oauthService.getIdentityClaims()?.['picture'] ? oauthService.getIdentityClaims()?.['picture'] : '/assets/img/portrait_placeholder.png'"
          [attr.alt]="'Profile picture for ' + oauthService.getIdentityClaims()?.['name'] + '. Click to open user menu.'"
          referrerpolicy="no-referrer"
          class="profile-image"
          [matMenuTriggerFor]="userMenu"
          [attr.tabindex]="'0'"
          [attr.role]="'button'"
          [attr.aria-haspopup]="'menu'"
          [attr.aria-label]="'Open user menu for ' + oauthService.getIdentityClaims()?.['name']">
        <mat-menu
          #userMenu="matMenu"
          class="wide-user-menu"
          [attr.aria-label]="'User menu'">
          <div
            mat-menu-item>
            <div
              class="user-card"
              role="group"
              [attr.aria-label]="'User information'">
              <img
                [src]="oauthService.getIdentityClaims()?.['picture']"
                [attr.alt]="''"
                referrerpolicy="no-referrer"
                class="profile-image"
                aria-hidden="true">
              <div class="details">
                <div class="name">{{oauthService.getIdentityClaims()?.['name'] }}</div>
                <div class="email">{{oauthService.getIdentityClaims()?.['email']}}</div>
              </div>
            </div>
          </div>
          <mat-divider role="separator" aria-hidden="true"></mat-divider>
          <button
            mat-menu-item
            type="button"
            (click)="oauthService.logOut()"
            [attr.aria-label]="'Sign out of your account'">
            <mat-icon aria-hidden="true">logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </div>
    }
  </div>
}
@else {
  <div class="centered-card">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>
          Sign In
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
      Sign in with Auth0
      </mat-card-content>
      <mat-card-actions>
        <button matButton="filled" color=primary (click)="oauthService.initImplicitFlow()">
          <mat-icon>login</mat-icon>
          Sign In
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
}
