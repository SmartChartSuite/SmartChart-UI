<header class="app-header">
  <div class="logo-container">
    <div class="logo" (click)="onPathSelected('/')">
      <span class="logo-icon">
        <img ngSrc="/assets/img/smartchart-mark.svg" width="32" height="32" alt="" aria-hidden="true">
      </span>
      <span class="logo-text">
        <span class="logo-smart">Smart</span><span class="logo-chart">Chart</span>
      </span>
    </div>
    <div class="logo-subtitle">Form-based Chart Abstraction</div>
  </div>
  @if (oauthService.hasValidAccessToken()) {
    <nav class="horizontal-nav">
      <button mat-button class="nav-item"
              (click)="onPathSelected('/')"
              [ngClass]="{'active': currentRoute() === '/'}">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </button>

      <button mat-button class="nav-item"
              (click)="onPathSelected('/jobs-forms')"
              [ngClass]="{'active': currentRoute() === '/jobs-forms'}">
        <mat-icon>grading</mat-icon>
         <span>Forms</span>
      </button>
    </nav>
  }
  <div class="content-spacer"></div>
  <div class="header-actions">
    @if (oauthService.hasValidAccessToken()) {
      <span class="icon">
        <sc-standalone-login [isLocatedInMainMenu]="true"></sc-standalone-login>
      </span>
    } @else {
      <button mat-button class="nav-item"
              (click)="signIn()">
        <mat-icon>login</mat-icon>
        <span>Sign In</span>
      </button>
    }
    <div class="version-text">{{ configService?.config?.version }}</div>
  </div>
</header>
